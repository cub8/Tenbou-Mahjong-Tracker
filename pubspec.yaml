name: tenbou_mahjong
description: "Aplikacja służąca do mierzenia punktów w Mahjongu."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.3.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  yaml: ^3.1.2
  flutter_riverpod: ">=3.2.1 <3.3.0"
  riverpod_annotation: ^4.0.2
  flutter_markdown_plus: ^1.0.7
  flutter_svg: ^2.3.0
  objectbox: ^5.3.2
  objectbox_flutter_libs: ^5.3.2
  path_provider: ^2.1.5
  path: ^1.9.1
  intl: ^0.20.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^3.2.5
  build_runner: ^2.4.15
  json_serializable: ^6.9.5
  riverpod_generator: ^4.0.3
  go_router_builder: ^4.3.0
  objectbox_generator: ^5.3.2

flutter:
  uses-material-design: true

  assets:
    - assets/yaku/
    - assets/images/yaku/
    - assets/images/game/
