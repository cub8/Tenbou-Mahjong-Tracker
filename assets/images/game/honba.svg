<svg viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Honba stick - główny kształt (taki jak riichi stick) -->
  <rect x="35" y="15" width="130" height="30" rx="15" fill="#f5f5f5" stroke="#cccccc" stroke-width="1"/>
  
  <!-- Wzór kropek na środku (2 kolumny po 4 kropki, ułożone wzdłuż) -->
  <g fill="#333333">
    <circle cx="85" cy="24" r="2.2"/>
    <circle cx="93" cy="24" r="2.2"/>
    <circle cx="101" cy="24" r="2.2"/>
    <circle cx="109" cy="24" r="2.2"/>
    
    <circle cx="85" cy="36" r="2.2"/>
    <circle cx="93" cy="36" r="2.2"/>
    <circle cx="101" cy="36" r="2.2"/>
    <circle cx="109" cy="36" r="2.2"/>
  </g>
</svg>