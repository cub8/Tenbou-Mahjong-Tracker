# Plik konfiguracyjny Yaku — asset bundlowany z aplikacją (feature: yaku_list)
# Format: lista płaska. Grupowanie po Han/Yakuman odbywa się w kodzie (presentation
# lub domain), nie w danych — analogicznie do podejścia z `tiles` w Event Sourcing,
# gdzie struktura danych jest minimalna a logika (np. wnioskowanie typu seta z
# długości grupy) żyje w silniku.
#
# Render Markdown: flutter_markdown_plus (aktywny fork po discontinued flutter_markdown,
# API ~identyczne ze starym pakietem — sprawdzić aktualną wersję na pub.dev przed startem).
#
# Pola:
#   id                      - unikalny identyfikator (snake_case, stabilny, do referencji/debug)
#   original_japanese_name  - nazwa w kanji/kana
#   romanized_japanese_name - nazwa w romaji (główna nazwa w widoku listy/szczegółowym)
#   english_name            - nazwa angielska (pomocnicza, mniejsza czcionka w UI)
#   description             - opis układu, Markdown-lite (np. **...**) do prezentacji w UI
#   han                     - liczba Han (int) | null jeśli is_yakuman == true
#   is_yakuman              - bool, true dla Yakuman/Double Yakuman
#   yakuman_multiplier      - int (1, 2...) | null jeśli is_yakuman == false
#   conditions              - lista warunków/zastrzeżeń (Markdown-lite); [] jeśli brak
#
#   index_tiles              - JEDEN skrócony zestaw setów, pokazujący to, co DEFINIUJE dany
#                               Yaku — nie przykładowy podzbiór pełnej ręki. Zasada: jeśli
#                               konkretna wartość/typ kafelka jest częścią reguły (np. Iipeikou
#                               wymaga identycznych sekwencji, Ryuuiisou wymaga konkretnych
#                               kafelków), pokazujemy ją. Jeśli definicją jest czysto STRUKTURA
#                               lub LICZBA elementów, a wartości są dowolne (np. Toitoi: cztery
#                               JAKIEKOLWIEK trójki; Suukantsu: cztery JAKIEKOLWIEK kany),
#                               zostawiamy [] — nie ma "kluczowego kafelka" do pokazania, a
#                               sugerowanie jednej wartości byłoby błędem (czytelnik mógłby
#                               pomyśleć, że ta konkretna wartość jest wymagana).
#                               Dla Yaku wymagających WSZYSTKICH elementów zbioru (Kokushi Musou:
#                               wszystkie 13 typów; Shousuushi/Daisuushi: wszystkie 4 wiatry),
#                               index_tiles zawiera kompletny zestaw, nie podzbiór.
#                               Dla Yaku opisujących zakres/ciągłość (Chuuren Poutou: 1 do 9),
#                               index_tiles może zawierać nakładające się grupy żeby pokazać
#                               cały zakres bez wymuszania pokazania całych 13-14 kafelków.
#                               [] również gdy Yaku nie jest opisywalny kafelkami w ogóle
#                               (np. Riichi, Nagashi Mangan) — UI wtedy pokazuje opis tekstowy.
#
#   variants                 - lista PEŁNYCH wariantów do widoku szczegółowego (show).
#                               [] jeśli nieopisywalny kafelkami.
#
#   Format setu (wspólny dla index_tiles i variants):
#     - lista kafelków w grupie; długość grupy => silnik wnioskuje typ
#       (2 = para, 3 = trójka/sekwencja, 4 = kan)
#     - interpreter dopełnia variants do standardowych 4 sety + 1 para, jeśli suma się
#       nie zgadza; index_tiles NIE jest dopełniane (świadomie niekompletny układ)
#
#   Uwaga ogólna o przykładach "kontekstowych" (Bakaze, Jikaze, Sangenpai): te Yaku nie
#   mają jednego "poprawnego" kafelka — Bakaze/Jikaze zależą od wiatru okrążenia/gracza,
#   Sangenpai może dotyczyć każdego z trzech smoków. W tych wpisach index_tiles/variants
#   pokazują JEDEN reprezentatywny przykład, z jasną notką w `conditions`, że jest to
#   ilustracja zasady, a nie jedyny poprawny wariant.

